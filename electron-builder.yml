appId: dev.gauthamsai.auralis
productName: Auralis
copyright: Copyright © 2026 Gautham Sai
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - build/loading.html
  - build/offline.html
  - build/search.html
  - build/search.js
  - build/mini-player.html
  - build/mini-player.js
  - build/prefs.html
  - build/prefs.js
  - build/icon.png
  - package.json
  - "!node_modules/**/*.map"
extraMetadata:
  main: dist-electron/main.js
linux:
  icon: build/icon.png
  category: AudioVideo
  desktop:
    entry:
      Name: Auralis
      Comment: Unofficial Apple Music client for Linux
      Categories: AudioVideo;Audio;Player;Network;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: pacman
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: flatpak
      arch: [x64]
deb:
  maintainer: Gautham Sai <https://github.com/gautham-sai05>
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libasound2
pacman:
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - alsa-lib
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - alsa-lib
flatpak:
  runtimeVersion: "23.08"
  finishArgs:
    - --share=network
    - --share=ipc
    - --socket=wayland
    - --socket=fallback-x11
    - --socket=pulseaudio
    - --device=dri
    # Narrow D-Bus grants rather than full session-bus access: just enough
    # for desktop notifications and for Auralis to own its own MPRIS name.
    - --talk-name=org.freedesktop.Notifications
    - --own-name=org.mpris.MediaPlayer2.auralis

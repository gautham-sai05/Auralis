<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
<title>Search Apple Music</title>
<style>
  html, body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  .box {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 56px;
    padding: 0 16px;
    background: #17171b;
    border: 1px solid #2c2c33;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
  }
  .icon { opacity: 0.5; flex-shrink: 0; }
  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f2f2f4;
    font-size: 17px;
  }
  input::placeholder { color: #6b6b78; }
  .hint {
    color: #55555e;
    font-size: 12px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="box">
    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aa4" stroke-width="2">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="q" type="text" placeholder="Search Apple Music…" autofocus />
    <span class="hint">Enter</span>
  </div>
  <script src="search.js"></script>
</body>
</html>

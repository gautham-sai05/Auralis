<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
<title>Auralis</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .mark {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: linear-gradient(160deg, #ff3b6e 0%, #a742ff 60%, #4a6bff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 40px rgba(167, 66, 255, 0.35);
  }
  .mark svg { width: 44px; height: 44px; }
  .title {
    color: #f2f2f4;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .status {
    color: #8b8b93;
    font-size: 13px;
  }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.15);
    border-top-color: #a742ff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 16.5c0 1.38 1.12 2.5 2.5 2.5S9 17.88 9 16.5 7.88 14 6.5 14 4 15.12 4 16.5z" fill="white"/>
        <path d="M15 14.5c0 1.38 1.12 2.5 2.5 2.5S20 15.88 20 14.5 18.88 12 17.5 12 15 13.12 15 14.5z" fill="white"/>
        <path d="M9 16.5V6.2c0-.5.36-.93.85-1.02l10-1.9c.6-.11 1.15.35 1.15.96V14.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">Auralis</div>
    <div class="spinner"></div>
    <div class="status">Connecting to Apple Music…</div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
<title>Auralis</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .mark {
    width: 96px;
    height: 96px;
    border-radius: 26px;
    background: radial-gradient(circle at 50% 40%, #241338 0%, #150c1e 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 40px rgba(167, 66, 255, 0.35);
  }
  .mark svg { width: 58px; height: 58px; }
  .bar { animation: bounce 1.1s ease-in-out infinite; transform-origin: center; }
  .bar:nth-child(1) { animation-delay: -0.9s; }
  .bar:nth-child(2) { animation-delay: -0.6s; }
  .bar:nth-child(3) { animation-delay: -0.3s; }
  .bar:nth-child(4) { animation-delay: -0.7s; }
  .bar:nth-child(5) { animation-delay: -0.2s; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }
  .title {
    color: #f2f2f4;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .status {
    color: #8b8b93;
    font-size: 13px;
  }

</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff5a82"/>
            <stop offset="50%" stop-color="#9660ff"/>
            <stop offset="100%" stop-color="#5a8cff"/>
          </linearGradient>
        </defs>
        <rect class="bar" x="4"  y="22" width="7" height="20" rx="3.5" fill="url(#g)"/>
        <rect class="bar" x="16" y="14" width="7" height="36" rx="3.5" fill="url(#g)"/>
        <rect class="bar" x="28" y="6"  width="7" height="52" rx="3.5" fill="url(#g)"/>
        <rect class="bar" x="40" y="14" width="7" height="36" rx="3.5" fill="url(#g)"/>
        <rect class="bar" x="52" y="22" width="7" height="20" rx="3.5" fill="url(#g)"/>
      </svg>
    </div>
    <div class="title">Auralis</div>
    <div class="status">Connecting to Apple Music…</div>
  </div>
</body>
</html>
